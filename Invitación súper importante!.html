<!DOCTYPE html>
<html lang="es" class="lock">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitación súper importante!</title>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600&family=Montserrat:wght@500;600&family=Great+Vibes&family=Pinyon+Script&family=Italianno&display=swap" rel="stylesheet">
<style>
:root{--ink:#25556F;--ink2:#3d6f8c;--ink3:#6c8fa6;--g1:#8a9aa8;--g2:#b2c0cb;--paper:#f6f8f8;--bg:#76876f;--bg2:#4f6049;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#3f4c3d;--bg2:#2b3529}}
:root[data-theme="dark"]{--bg:#3f4c3d;--bg2:#2b3529}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 30% 0,var(--bg),var(--bg2));font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;color:var(--ink);overflow-x:hidden}
html.lock,html.lock body{overflow:hidden;height:100%}
html.lock body{position:fixed;width:100%}
.page{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 12px 36px}
.slot{--w:min(420px,90vw);width:var(--w);position:relative;clip-path:inset(-100vh -50vw -30px -50vw);opacity:0;transition:opacity .4s}
.slot.ready{opacity:1}
.slot.open{transition:transform 2.2s cubic-bezier(.2,.75,.25,1) .75s,opacity .4s}
.env{position:absolute;left:0;right:0;bottom:0;aspect-ratio:3/2;transition:transform 1.1s ease,opacity 1s ease}
.env-b{z-index:1}
.env-f{z-index:3;border:0;background:none;padding:0;cursor:pointer}
.eb,.front,.fl,.fb{position:absolute;inset:0}
.eb{background:var(--g1);border-radius:6px}
.front{background:var(--g2);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);border-radius:6px}
.fl{background:#a3b3c0;clip-path:polygon(0 0,100% 0,50% 58%);transform-origin:top;transform:perspective(900px) rotateX(0);transition:transform .4s ease-in}
.fb{background:#7c8d9b;clip-path:polygon(0 0,100% 0,50% 58%);transform-origin:top;transform:perspective(900px) rotateX(90deg);transition:transform .45s .4s ease-out}
.seal{position:absolute;left:50%;top:58%;width:60px;height:60px;margin:-34px 0 0 -30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:400 48px/1 "Great Vibes","Pinyon Script",cursive;padding:0 2px 8px 0;box-shadow:0 3px 8px rgba(0,0,0,.3),inset 0 0 0 3px rgba(255,255,255,.18);transition:opacity .25s}
.env-f:focus-visible{outline:3px solid #fff;outline-offset:6px}
.letter{position:relative;z-index:2;transform:translateY(calc(100% - var(--w)*.46 + 30px));opacity:0;transition:transform 2s cubic-bezier(.2,.75,.25,1) .75s,opacity .5s .8s}
.letter::before{content:"";position:absolute;inset:6% -9% 14% -9%;background:#8896a3;border-radius:42% 58% 50% 50%/38% 46% 54% 62%;transform:rotate(3deg);z-index:-1}
.open .fl{transform:perspective(900px) rotateX(90deg)}
.open .fb{transform:perspective(900px) rotateX(180deg)}
.open .seal{opacity:0}
.open .letter{transform:none;opacity:1}
.open .env{transform:translateY(40%);opacity:0;transition:transform .9s ease .75s,opacity .7s ease .75s}
.outer{background:#fff;padding:calc(var(--w)*.03);border-radius:22px;transform:rotate(-1deg);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.frame{padding:calc(var(--w)*.05);background:conic-gradient(var(--g1) 25%,var(--g2) 0 50%,var(--g1) 0 75%,var(--g2) 0) 0 0/36px 36px}
.paper{background:var(--paper);padding:calc(var(--w)*.09) 6px calc(var(--w)*.07);text-align:center}
.t1{font:400 calc(var(--w)*.052)/1 Antonio,Impact,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin:0}
.t2{font:400 calc(var(--w)*.125)/.95 Antonio,Impact,sans-serif;text-transform:uppercase;margin:4px 0 0}
.t2 small{font-size:.5em;color:var(--ink2)}
.cum{font:400 calc(var(--w)*.215)/.85 "Pinyon Script","Italianno",cursive;margin:-.14em 0 -.02em;white-space:nowrap}
.fecha{font:400 calc(var(--w)*.068) Antonio,Impact,sans-serif;text-transform:uppercase;margin:4px 0 10px}
.lugar{display:inline-block;background:none;border:0;border-bottom:1.5px solid var(--ink3);padding:2px 2px 3px;font:600 13px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);cursor:pointer}
.lugar:focus-visible,.cal:focus-visible,.maps a:focus-visible{outline:3px solid var(--ink2);outline-offset:3px}
.addr{font-size:11px;color:var(--ink3);margin:6px 0 0}
.maps{display:none;gap:8px;justify-content:center;margin-top:10px}
.maps.on{display:flex}
.maps a{font:600 12px Montserrat,sans-serif;color:var(--ink);border:1.5px solid var(--ink2);border-radius:20px;padding:6px 14px;text-decoration:none}
svg.pic{width:84%;max-width:300px;margin:12px auto 0;display:block;overflow:visible}
.d{fill:var(--f,none);fill-opacity:0;stroke-opacity:0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.open .d{animation:draw 1.5s ease calc(var(--d)*.6 + 2.4s) forwards,fillin .8s ease calc(var(--d)*.6 + 3.6s) forwards}
.r{opacity:0;transform:translateY(14px);filter:blur(4px)}
.open .r{animation:rin .9s ease var(--t,2s) forwards}
@keyframes rin{to{opacity:1;transform:none;filter:none}}
.cum{clip-path:inset(-40% 100% -40% -10%)}
.open .cum{animation:write 1.7s cubic-bezier(.4,0,.2,1) 2.3s forwards}
@keyframes write{to{clip-path:inset(-40% -15% -40% -10%)}}
@keyframes draw{from{stroke-opacity:1;stroke-dashoffset:1}to{stroke-opacity:1;stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:var(--o,1)}}
.espero{font:600 14px Montserrat,sans-serif;letter-spacing:.1em;text-transform:uppercase;margin:6px 0 4px}
.wave{width:130px;height:12px;display:block;margin:4px auto}
.puntual{font:600 12px Montserrat,sans-serif;letter-spacing:.06em;text-transform:uppercase;margin:6px 0 0}
.sprig{position:absolute;width:96px;z-index:3;pointer-events:none}
.s1{right:-30px;top:-8px}
.s2{left:-34px;bottom:40px;transform:rotate(190deg)}
.hint{position:fixed;left:0;right:0;top:calc(50% + min(420px,90vw)*.333 + 30px);z-index:6;margin:0;text-align:center;color:#fff;font:400 30px/1.15 "Italianno","Pinyon Script",cursive;padding:0 20px;transition:opacity .6s}
.acts{width:min(420px,90vw);margin:26px auto 0;opacity:0}
.open~.acts,.acts.on{animation:in .9s 2.8s forwards}
@keyframes in{to{opacity:1}}
.cal{display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;color:#fff;font:400 27px/1 "Italianno","Pinyon Script",cursive;padding:14px 22px;border-radius:40px;background:linear-gradient(135deg,var(--ink),var(--ink2));border:2px solid rgba(255,255,255,.85);box-shadow:0 10px 24px rgba(0,0,0,.28)}
.cal svg{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="sp"><path d="M2 62 C22 44 44 26 76 8" stroke="#6f7d5a" fill="none" stroke-width="2"/><ellipse cx="20" cy="48" rx="10" ry="4.5" transform="rotate(-35 20 48)" fill="#8a9a74"/><ellipse cx="32" cy="38" rx="10" ry="4.5" transform="rotate(-80 32 38)" fill="#9aa986"/><ellipse cx="42" cy="30" rx="10" ry="4.5" transform="rotate(-30 42 30)" fill="#7d8f68"/><ellipse cx="56" cy="20" rx="9" ry="4" transform="rotate(-75 56 20)" fill="#8a9a74"/><ellipse cx="68" cy="12" rx="8" ry="4" transform="rotate(-25 68 12)" fill="#9aa986"/></g></defs></svg>

<div class="page">
 <div class="slot" id="slot">
  <div class="env env-b"><div class="eb"></div><div class="fb"></div></div>

  <div class="letter">
   <div class="outer"><div class="frame"><div class="paper">
    <p class="t1 r" style="--t:1.7s">Te invito a</p>
    <p class="t2 r" style="--t:1.95s">Festejar <small>mi</small></p>
    <p class="cum">Cumple</p>
    <p class="fecha r" style="--t:3.4s">13 de noviembre | 16:30h</p>
    <div class="r" style="--t:3.8s">
      <button class="lugar" id="lugar" aria-expanded="false">Restaurante Cauce</button>
      <p class="addr">Rambla República del Perú 1371, Montevideo</p>
      <div class="maps" id="maps">
        <a id="gmaps" target="_blank" rel="noopener">Google Maps</a>
        <a id="amaps" target="_blank" rel="noopener">Apple Maps</a>
      </div>
    </div>

    <svg class="pic" viewBox="0 0 250 170" aria-hidden="true">
      <path class="d" pathLength="1" style="stroke:#25556F;--f:#fff;--d:1.8s" d="M14 112 Q125 96 238 108 L214 140 Q150 160 112 152 Q60 148 38 138 Z"/>
      <path class="d" pathLength="1" style="stroke:#6c8fa6;--d:2.6s" d="M30 124 Q124 110 224 120"/>
      <path class="d" pathLength="1" style="stroke:#25556F;--f:#25556F;--d:2.1s" d="M54 112 V62 Q54 52 60 44 V22 H72 V44 Q78 52 78 62 V112 Z"/>
      <path class="d" pathLength="1" style="stroke:#7a5c33;--f:#a07c45;--d:2.1s" d="M60 16 H72 V22 H60 Z"/>
      <path class="d" pathLength="1" style="stroke:#25556F;--f:#f6f8f8;--d:2.6s" d="M57 78 H75 V100 H57 Z"/>
      <path class="d" pathLength="1" style="stroke:#b5323c;--f:#c0404a;--d:2.9s" d="M66 52 C50 36 48 56 66 52 C84 56 82 36 66 52 M66 52 L52 66 M66 52 L80 66"/>
      <path class="d" pathLength="1" style="stroke:#25556F;--f:#6c8fa6;--o:.6;--d:2.4s" d="M92 60 H120 Q120 86 106 88 Q92 86 92 60 Z M106 88 V112 M96 112 H116"/>
      <path class="d" pathLength="1" style="stroke:#25556F;--f:#3d6f8c;--o:.8;--d:2.7s" d="M94 70 H118 Q116 84 106 86 Q96 84 94 70 Z"/>
      <path class="d" pathLength="1" style="stroke:#25556F;--f:#6c8fa6;--o:.6;--d:2.6s" d="M124 54 H152 Q152 80 138 82 Q124 80 124 54 Z M138 82 V108 M128 108 H148"/>
      <path class="d" pathLength="1" style="stroke:#25556F;--f:#3d6f8c;--o:.8;--d:2.9s" d="M126 64 H150 Q148 78 138 80 Q128 78 126 64 Z"/>
      <ellipse class="d" pathLength="1" style="stroke:#25556F;--f:#fff;--d:3s" cx="182" cy="116" rx="44" ry="13"/>
      <ellipse class="d" pathLength="1" style="stroke:#6c8fa6;--f:#e3ebf0;--d:3.2s" cx="182" cy="116" rx="32" ry="8"/>
      <path class="d" pathLength="1" style="stroke:#8e2430;--f:#cf4650;--d:3.4s" d="M156 100 Q146 102 150 114 Q156 124 164 114 Q168 102 156 100 Z"/>
      <path class="d" pathLength="1" style="stroke:#3f6030;--f:#6a9a4d;--d:3.5s" d="M151 101 L157 96 L163 101 L157 104 Z"/>
      <path class="d" pathLength="1" style="stroke:#8e2430;--f:#cf4650;--d:3.6s" d="M172 106 Q162 108 166 120 Q172 128 180 120 Q184 108 172 106 Z"/>
      <path class="d" pathLength="1" style="stroke:#3f6030;--f:#6a9a4d;--d:3.7s" d="M167 107 L173 102 L179 107 L173 110 Z"/>
      <circle class="d" pathLength="1" style="stroke:#5c1e32;--f:#9a3550;--d:3.8s" cx="196" cy="102" r="6"/>
      <circle class="d" pathLength="1" style="stroke:#5c1e32;--f:#9a3550;--d:3.9s" cx="208" cy="102" r="6"/>
      <circle class="d" pathLength="1" style="stroke:#5c1e32;--f:#9a3550;--d:4s" cx="202" cy="112" r="6"/>
      <circle class="d" pathLength="1" style="stroke:#5c1e32;--f:#9a3550;--d:4.1s" cx="214" cy="112" r="6"/>
      <circle class="d" pathLength="1" style="stroke:#5c1e32;--f:#9a3550;--d:4.2s" cx="208" cy="122" r="6"/>
      <path class="d" pathLength="1" style="stroke:#3f6030;--f:#6a9a4d;--d:4.3s" d="M202 96 Q204 88 214 88 Q212 96 204 96"/>
    </svg>

    <p class="espero r" style="--t:5.3s">Te espero</p>
    <svg class="wave r" style="--t:5.7s" viewBox="0 0 130 12" aria-hidden="true"><path d="M2 6 Q12 -2 22 6 T42 6 T62 6 T82 6 T102 6 T122 6" fill="none" stroke="#25556F" stroke-width="1.5" stroke-linecap="round"/></svg>
    <p class="puntual r" style="--t:6s">Llegar puntual!!</p>
   </div></div></div>
  </div>

  <button class="env env-f" id="env" aria-label="Abrir la invitación">
    <div class="front"></div><div class="fl"></div><div class="seal">V</div>
  </button>
 </div>

 <p class="hint" id="hint">Toca el sobre para vivir el mejor día del mes!</p>

 <div class="acts" id="acts">
  <a class="cal" id="cal" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M12 13.2l1 2.1 2.3.3-1.7 1.6.4 2.3-2-1.1-2 1.1.4-2.3-1.7-1.6 2.3-.3z"/></svg>
    Guardar la fecha en mi calendario
  </a>
 </div>
</div>

<script>
var q = encodeURIComponent("Restaurante Cauce, Rambla República del Perú 1371, Montevideo, Uruguay");
document.getElementById("gmaps").href = "https://www.google.com/maps/search/?api=1&query=" + q;
document.getElementById("amaps").href = "https://maps.apple.com/?q=" + q;
document.getElementById("cal").href = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
  "&text=" + encodeURIComponent("Cumple de Vale!") +
  "&dates=20261113T163000/20261113T190000&ctz=America/Montevideo" +
  "&location=" + q +
  "&details=" + encodeURIComponent("Llegar puntual!!");

var lugar = document.getElementById("lugar"), maps = document.getElementById("maps");
lugar.onclick = function(){
  lugar.setAttribute("aria-expanded", maps.classList.toggle("on"));
};

var slot = document.getElementById("slot"), env = document.getElementById("env");
function center(){
  if (slot.classList.contains("open")) return;
  slot.style.transform = "none";
  var r = env.getBoundingClientRect();
  slot.style.transform = "translateY(" + (window.innerHeight/2 - (r.top + r.height/2)) + "px)";
  slot.classList.add("ready");
}
center(); window.addEventListener("resize", center);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(center);
env.onclick = function(){
  if (slot.classList.contains("open")) return;
  slot.classList.add("open");
  slot.style.transform = "none";
  document.documentElement.classList.remove("lock");
  env.style.pointerEvents = "none";
  document.getElementById("hint").style.opacity = 0;
  document.getElementById("acts").classList.add("on");
  setTimeout(function(){ document.getElementById("hint").style.display = "none"; }, 700);
};
</script>
</body>
</html>
